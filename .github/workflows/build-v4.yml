name: Build DeutschTrainer V4
on:
  workflow_dispatch:
  push:
    branches: [ "main", "html-first-v4" ]
    paths:
      - "appv4/**"
      - "settings.gradle.kts"
      - ".github/workflows/build-v4.yml"

jobs:
  build-v4:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore stable V4 debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: deutschtrainer-v4-debug-signing-v1
      - name: Create signing key if needed
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
      - name: Build only the fresh V4 module
        run: gradle :appv4:assembleDebug --stacktrace
      - name: Upload V4 APK
        uses: actions/upload-artifact@v4
        with:
          name: DeutschTrainer-V4
          path: appv4/build/outputs/apk/debug/appv4-debug.apk
